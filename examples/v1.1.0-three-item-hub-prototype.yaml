type: custom:honeycomb-persistent-hub
name: Sommerhus
size: 82
logo: auto

style:
  left: 50%
  top: 50%

items:
  - type: light
    entity: light.ia_kokken_kokken
    name: Køkken
    icon: mdi:data-matrix
    presets:
      brightness:
        entity: number.ia_kokken_20_1_kokken_terassedor_kokken_spot_normal_brightness
      kelvin:
        entity: number.ia_kokken_20_1_kokken_terassedor_kokken_spot_standard_kelvin

  - type: light
    entity: light.hue_kontor
    name: Kontor
    icon: mdi:lightbulb
    presets:
      brightness:
        entity: number.ia_stue_20_2_kokken_kokkeno_stue_normal_brightness
      kelvin:
        entity: number.ia_stue_20_2_kokken_kokkeno_stue_standard_kelvin
      color:
        hue_entity: number.ia_stue_20_2_kokken_kokkeno_stue_standard_hue
        saturation_entity: number.ia_stue_20_2_kokken_kokkeno_stue_standard_saturation

  - type: media
    entity: media_player.drivhus_drivhus
    name: Sonos
    icon: mdi:speaker
    group_volume_down_script: script.sonos_drivhus_group_volume_down
    group_volume_up_script: script.sonos_drivhus_group_volume_up
    toggle_member_script: script.sonos_drivhus_toggle_member
    favorites_sensor: sensor.sonos_favorites
    favorites_cache_sensor: sensor.sonos_favorites_cache
    members:
      - entity: media_player.tv_stue
        name: TV Stue
        icon: mdi:television-speaker
      - entity: media_player.privat_bad
        name: Privat Bad
      - entity: media_player.bathroom
        name: Bad
      - entity: media_player.kontor
        name: Kontor
      - entity: media_player.kokken
        name: Køkken
