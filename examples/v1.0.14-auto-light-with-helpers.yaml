type: custom:honeycomb-persistent-control
entity: light.hue_kontor
icon: mdi:lightbulb
size: 82
active: true

tap_action:
  action: toggle

presets:
  brightness:
    entity: number.ia_stue_20_2_kokken_kokkeno_stue_normal_brightness
  kelvin:
    entity: number.ia_stue_20_2_kokken_kokkeno_stue_standard_kelvin
  color:
    hue_entity: number.ia_stue_20_2_kokken_kokkeno_stue_standard_hue
    saturation_entity: number.ia_stue_20_2_kokken_kokkeno_stue_standard_saturation

menu:
  empty_slots: hidden
  idle_timeout: 8000

  buttons:
    - slot: 1
      slot_mode: hard
      icon: mdi:brightness-7
      name: 100%
      show_name: true
      autoclose: false
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        data:
          brightness_pct: 100

    - slot: 2
      slot_mode: hard
      control: preset-brightness

    - slot: 3
      slot_mode: hard
      control: light-palette

    - slot: 4
      slot_mode: hard
      control: preset-standard

    - slot: 5
      slot_mode: hard
      icon: mdi:minus
      name: 5%
      show_name: true
      autoclose: false
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        data:
          brightness_step_pct: -5

    - slot: 6
      slot_mode: hard
      icon: mdi:plus
      name: 5%
      show_name: true
      autoclose: false
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        data:
          brightness_step_pct: 5
