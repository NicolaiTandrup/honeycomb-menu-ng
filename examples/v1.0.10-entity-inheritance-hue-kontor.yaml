type: custom:honeycomb-persistent-control
entity: light.hue_kontor
icon: mdi:lightbulb
size: 82
active: true

style:
  left: 42%
  top: 45%

tap_action:
  action: toggle

menu:
  size: 250
  empty_slots: hidden
  center_brightness: 25
  drag_select: true
  drag_deadzone: 12
  hover_highlight: true
  idle_timeout: 8000

  buttons:
    - slot: 1
      slot_mode: hard
      icon: mdi:brightness-7
      name: 100%
      show_name: true
      autoclose: false
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        data:
          brightness_pct: 100

    - slot: 2
      slot_mode: hard
      icon: mdi:brightness-percent
      name: 60%
      show_name: true
      autoclose: false
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        data:
          brightness_pct: 60

