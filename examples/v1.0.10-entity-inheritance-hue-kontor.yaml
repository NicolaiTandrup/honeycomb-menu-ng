      name: Color
      show_name: true
      autoclose: false
      tap_action:
        action: fire-dom-event
        honeycomb_menu:
          nested_expand: true
          inherit_inner: true
          empty_slots: hidden
          idle_timeout: 8000
          buttons:
            - slot: 7
              slot_mode: hard
              show_icon: false
              show_name: false
              autoclose: false
              styles:
                card:
                  - background: rgb(255,45,45)
                  - border: 1px solid rgba(255, 255, 255, 0.20)
              tap_action:
                action: perform-action
                perform_action: light.turn_on
                data:
                  rgb_color: [255, 45, 45]

