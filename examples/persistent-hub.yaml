# Honeycomb Menu NG v1.5 persistent Hub example
type: custom:honeycomb-persistent-hub
name: Living room
size: 82
logo: auto

items:
  - type: light
    entity: light.living_room
    name: Living room
    icon: mdi:lightbulb
    presets:
      brightness:
        entity: number.wall_switch_normal_brightness
      kelvin:
        entity: number.wall_switch_standard_kelvin

  - type: sonos
    entity: media_player.living_room
    name: Sonos
    icon: mdi:speaker
    active_color: "#00bcd4"
    favorites_sensor: sensor.sonos_favorites
    favorites_cache_sensor: sensor.sonos_favorites_cache
