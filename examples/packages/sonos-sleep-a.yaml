# Optional Home Assistant PACKAGE, not Lovelace YAML. One copy per selected player.
# Replace player_a / sleep_a consistently when creating an independent instance.
# No browser timer and no native Sonos hardware timer is armed by this package.
input_text:
  sonos_sleep_a:
    name: Sonos Sleep A state
    max: 255
    # Explicit fail-closed restart/helper-reload policy; never restore an armed job.
    initial: 'hc1:{"v":1,"p":"media_player.player_a","s":"restart_cancelled"}'
input_datetime:
  sonos_sleep_deadline_a:
    name: Sonos Sleep A deadline
    has_date: true
    has_time: true

script:
  sonos_sleep_a:
    alias: Sonos Sleep A command
    mode: queued
    max: 20
    fields:
      operation:
        description: start, cancel, or package-internal check/expire/invalidate/restart
      player:
        description: Must equal this package's fixed selected player
      minutes:
        description: 15, 30, 45, 60 or 90
      expected_end:
        description: Package-internal expiry token (UTC epoch seconds)
    sequence:
      - variables:
          selected: media_player.player_a
          status_entity: input_text.sonos_sleep_a
          deadline_entity: input_datetime.sonos_sleep_deadline_a
      - if: "{{ player | default('') != selected }}"
        then:
          - stop: Timer configuration targets another selected player.
            error: true
      - variables:
          command: "{{ operation | default('check') }}"
          duration: "{{ minutes | default(0) | int(0) }}"
          record: "{{ states(status_entity)[4:] | from_json({}) if states(status_entity).startswith('hc1:') else {} }}"
          members: "{{ state_attr(selected, 'group_members') | default([], true) }}"
          leader: "{{ members[0] if members is sequence and members is not string and members | count else '' }}"
          fingerprint: "{{ (leader ~ ':' ~ (members | sort | join('|'))) | sha256 }}"
          group_ok: >-
            {%- set ns = namespace(ok=has_value(selected) and leader != '' and selected in members and members | unique | list | count == members | count) -%}
            {%- for member in members -%}
              {%- set other = state_attr(member, 'group_members') | default([], true) -%}
              {%- if member not in integration_entities('sonos') or not has_value(member) or other is string or other | count == 0 or other[0] != leader or other | sort != members | sort -%}
                {%- set ns.ok = false -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.ok }}
      - choose:
          - conditions: "{{ command in ['cancel', 'restart', 'invalidate'] }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: "{{ status_entity }}"
                data:
                  value: "{{ 'hc1:' ~ ({'v':1,'p':selected,'s': 'off' if command == 'cancel' else 'restart_cancelled' if command == 'restart' else 'group_changed'} | to_json) }}"
          - conditions: "{{ command == 'start' }}"
            sequence:
              - if: "{{ duration not in [15,30,45,60,90] or not group_ok or not is_state(leader, 'playing') or not (state_attr(leader, 'supported_features') | int(0) | bitwise_and(1)) }}"
                then:
                  - stop: Sleep requires an available, playing, registry-confirmed Sonos group and a supported duration.
                    error: true
              - variables:
                  armed: "{{ as_timestamp(now()) }}"
                  end: "{{ armed | int + duration * 60 }}"
                  payload: "{{ 'hc1:' ~ ({'v':1,'p':selected,'s':'running','g':fingerprint,'e':end,'m':duration,'a':armed} | to_json) }}"
              - if: "{{ payload | length > 255 }}"
                then:
                  - stop: Selected entity identifier exceeds the compact helper-state capacity.
                    error: true
              # Disarm first and arm last: interrupted writes cannot activate a job.
              - action: input_text.set_value
                target:
                  entity_id: "{{ status_entity }}"
                data:
                  value: "{{ 'hc1:' ~ ({'v':1,'p':selected,'s':'off'} | to_json) }}"
              - action: input_datetime.set_datetime
                target:
                  entity_id: "{{ deadline_entity }}"
                data:
                  timestamp: "{{ end }}"
              - condition: template
                value_template: "{{ fingerprint == ((state_attr(selected, 'group_members')[0] ~ ':' ~ (state_attr(selected, 'group_members') | sort | join('|'))) | sha256) }}"
              - action: input_text.set_value
                target:
                  entity_id: "{{ status_entity }}"
                data:
                  value: "{{ payload }}"
          - conditions: "{{ command in ['check','expire'] and record.get('s') == 'running' and record.get('p') == selected }}"
            sequence:
              - choose:
                  - conditions: "{{ not group_ok or record.get('g') != fingerprint }}"
                    sequence:
                      - action: input_text.set_value
                        target:
                          entity_id: "{{ status_entity }}"
                        data:
                          value: "{{ 'hc1:' ~ ({'v':1,'p':selected,'s':'group_changed'} | to_json) }}"
                  - conditions: "{{ command == 'expire' and expected_end | default(0) | int(0) == record.get('e', 0) and as_timestamp(now()) >= record.get('e', 0) }}"
                    sequence:
                      # Consume before calling playback: duplicate events are idempotent.
                      - action: input_text.set_value
                        target:
                          entity_id: "{{ status_entity }}"
                        data:
                          value: "{{ 'hc1:' ~ ({'v':1,'p':selected,'s':'expired'} | to_json) }}"
                      - if: "{{ not is_state(leader, 'playing') }}"
                        then:
                          - stop: Playback is already inactive.
                      - choose:
                          - conditions: "{{ not (state_attr(leader, 'supported_features') | int(0) | bitwise_and(1)) or fingerprint != ((state_attr(selected, 'group_members')[0] ~ ':' ~ (state_attr(selected, 'group_members') | sort | join('|'))) | sha256) }}"
                            sequence:
                              - action: input_text.set_value
                                target:
                                  entity_id: "{{ status_entity }}"
                                data:
                                  value: "{{ 'hc1:' ~ ({'v':1,'p':selected,'s':'action_failed'} | to_json) }}"
                              - stop: Playback capability or group changed before pause.
                      - action: media_player.media_pause
                        continue_on_error: true
                        target:
                          entity_id: "{{ leader }}"
                      - wait_template: "{{ states(leader) in ['paused','idle','off','unknown','unavailable'] }}"
                        timeout: "00:00:05"
                        continue_on_timeout: true
                      - action: input_text.set_value
                        target:
                          entity_id: "{{ status_entity }}"
                        data:
                          value: "{{ 'hc1:' ~ ({'v':1,'p':selected,'s':'expired' if states(leader) in ['paused','idle','off'] else 'action_failed'} | to_json) }}"

automation:
  - id: honeycomb_sonos_sleep_a
    alias: Honeycomb Sonos Sleep A scheduler and group guard
    mode: queued
    max: 100
    triggers:
      - trigger: time
        at: input_datetime.sonos_sleep_deadline_a
        id: due
      # Catch a missed time trigger / automation reload, using the persisted UTC end.
      - trigger: time_pattern
        minutes: "/1"
        id: due
      - trigger: homeassistant
        event: start
        id: restart
      - trigger: event
        event_type: automation_reloaded
        id: restart
      - trigger: event
        event_type: state_changed
        id: state
    variables:
      selected: media_player.player_a
      status_entity: input_text.sonos_sleep_a
    conditions:
      - condition: template
        value_template: >-
          {%- set r = states(status_entity)[4:] | from_json({}) if states(status_entity).startswith('hc1:') else {} -%}
          {%- set members = state_attr(selected, 'group_members') | default([], true) -%}
          {{ trigger.id == 'restart' or (r.get('s') == 'running' and (trigger.id == 'due' or ((trigger.event.data.entity_id == selected or trigger.event.data.entity_id in members) and as_timestamp(trigger.event.time_fired) >= r.get('a', 0)))) }}
    actions:
      - variables:
          record: "{{ states(status_entity)[4:] | from_json({}) if states(status_entity).startswith('hc1:') else {} }}"
          changed: >-
            {%- if trigger.id == 'state' -%}
              {%- set old = trigger.event.data.old_state -%}
              {%- set new = trigger.event.data.new_state -%}
              {%- set before = old.attributes.get('group_members', []) if old else [] -%}
              {%- set after = new.attributes.get('group_members', []) if new else [] -%}
              {{ not old or not new or new.state in ['unknown','unavailable'] or before | sort != after | sort or (before | first | default('')) != (after | first | default('')) }}
            {%- else -%}{{ false }}{%- endif -%}
      - action: script.sonos_sleep_a
        data:
          player: "{{ selected }}"
          operation: "{{ 'restart' if trigger.id == 'restart' else 'invalidate' if changed else 'expire' if trigger.id == 'due' else 'check' }}"
          expected_end: "{{ record.get('e',0) }}"
