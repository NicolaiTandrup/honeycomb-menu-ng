# Honeycomb v1.7: numeric values may live on a separate device/integration.
# Both number.* and input_number.* are supported; create/verify them in HA first.
type: custom:honeycomb-persistent-hub
name: Hub A
size: 82
logo: auto
items:
  - type: light
    entity: light.zone_a
    name: Light A
    presets:
      brightness:
        entity: number.relay_a_brightness
      kelvin:
        entity: number.relay_a_kelvin
      color:
        hue_entity: input_number.preset_a_hue
        saturation_entity: input_number.preset_a_saturation
