# Optional HA backend cache. Existing cache sensors/templates remain supported.
# Configure eligible Sonos source players ONCE below; they must share the same
# favorites library. The first available player is used on each refresh.
# Keep sensor.favorites_a synchronized with your enabled Sonos favorites entity.
# With template: !include templates.yaml, copy only the list item, not template:.
template:
  - triggers:
      - trigger: event
        event_type: sonos_favorites_refresh
      - trigger: state
        entity_id: sensor.favorites_a
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ has_value('sensor.favorites_a') }}"
    actions:
      - variables:
          cache_players:
            - media_player.player_a
            - media_player.player_b
      - variables:
          cache_player: >-
            {% set ns = namespace(entity='') %}
            {% for entity in cache_players %}
              {% if not ns.entity and has_value(entity) %}
                {% set ns.entity = entity %}
              {% endif %}
            {% endfor %}
            {{ ns.entity }}
      - condition: template
        value_template: "{{ cache_player != '' }}"
      - action: media_player.browse_media
        target:
          entity_id: "{{ cache_player }}"
        data:
          media_content_type: favorites_folder
          media_content_id: object.item.audioItem.audioBroadcast
        response_variable: sonos_radio_favorites
    sensor:
      - name: Favorites Cache A
        unique_id: favorites_cache_a
        icon: mdi:radio
        state: >-
          {{ sonos_radio_favorites.get(cache_player, {}).get('children', []) | count }}
        attributes:
          source_player: "{{ cache_player }}"
          cache_version: 2
          items: >-
            {% set children = sonos_radio_favorites.get(cache_player, {}).get('children', []) %}
            {% set ns = namespace(items=[]) %}
            {% for item in children[:12] %}
              {% set ns.items = ns.items + [{
                'title': item.title,
                'media_content_id': item.media_content_id,
                'media_content_type': item.media_content_type,
                'thumbnail': item.thumbnail | default('', true),
                'uri': item.get('uri', item.get('playback_uri', ''))
              }] %}
            {% endfor %}
            {{ ns.items }}
