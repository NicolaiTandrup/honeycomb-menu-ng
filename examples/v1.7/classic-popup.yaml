type: button
entity: light.zone_a
name: Light A
hold_action:
  action: fire-dom-event
  honeycomb_menu:
    entity: light.zone_a
    size: 225
    empty_slots: hidden
    center_button:
      icon: mdi:lightbulb
      tap_action:
        action: more-info
    buttons:
      - slot: 1
        slot_mode: hard
        icon: mdi:lightbulb-on
        tap_action:
          action: perform-action
          perform_action: light.turn_on
          target:
            entity_id: light.zone_a
      - slot: 4
        slot_mode: hard
        icon: mdi:lightbulb-off
        tap_action:
          action: perform-action
          perform_action: light.turn_off
          target:
            entity_id: light.zone_a
