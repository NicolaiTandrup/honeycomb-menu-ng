# Honeycomb Menu NG v1.0.0 - Persistent Center Test 14
# Reference entity: light.hue_kontor
#
# Test goals:
# 1. The center hexagon is always visible.
# 2. Single tap toggles light.hue_kontor.
# 3. Hold opens the six-button Honeycomb ring without toggling the light.
# 4. Closing the ring leaves the persistent center visible.
# 5. External state changes are reflected by the wrapped center card.

type: custom:honeycomb-persistent-control
entity: light.hue_kontor
icon: mdi:lightbulb
size: 82
active: true

tap_action:
  action: toggle

menu:
  entity: light.hue_kontor
  size: 250
  empty_slots: hidden
  center_brightness: 25
  drag_select: true
  drag_deadzone: 12
  hover_highlight: true
  idle_timeout: 8000

  center_button:
    entity: light.hue_kontor
    icon: mdi:lightbulb
    autoclose: false
    tap_action:
      action: toggle

  buttons:
    - slot: 1
      slot_mode: hard
      entity: light.hue_kontor
      icon: mdi:brightness-7
      name: 100%
      show_name: true
      autoclose: false
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        target:
          entity_id: light.hue_kontor
        data:
          brightness_pct: 100

    - slot: 2
      slot_mode: hard
      entity: light.hue_kontor
      icon: mdi:brightness-percent
      name: 60%
      show_name: true
      autoclose: false
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        target:
          entity_id: light.hue_kontor
        data:
          brightness_pct: 60

    - slot: 3
      slot_mode: hard
      entity: light.hue_kontor
      icon: mdi:palette
      name: Color
      show_name: true
      autoclose: false
      tap_action:
        action: fire-dom-event
        honeycomb_menu:
          entity: light.hue_kontor
          nested_expand: true
          size: 250
          empty_slots: hidden
          idle_timeout: 8000
          buttons:
            - slot: 1
              slot_mode: hard
              entity: light.hue_kontor
              icon: mdi:circle
              name: Red
              show_name: true
              autoclose: false
              tap_action:
                action: perform-action
                perform_action: light.turn_on
                target:
                  entity_id: light.hue_kontor
                data:
                  rgb_color: [255, 0, 0]

            - slot: 2
              slot_mode: hard
              entity: light.hue_kontor
              icon: mdi:circle
              name: Blue
              show_name: true
              autoclose: false
              tap_action:
                action: perform-action
                perform_action: light.turn_on
                target:
                  entity_id: light.hue_kontor
                data:
                  rgb_color: [0, 80, 255]

            - slot: 3
              slot_mode: hard
              entity: light.hue_kontor
              icon: mdi:circle
              name: Warm
              show_name: true
              autoclose: false
              tap_action:
                action: perform-action
                perform_action: light.turn_on
                target:
                  entity_id: light.hue_kontor
                data:
                  color_temp_kelvin: 2700

    - slot: 4
      slot_mode: hard
      entity: light.hue_kontor
      icon: mdi:temperature-kelvin
      name: 2700K
      show_name: true
      autoclose: false
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        target:
          entity_id: light.hue_kontor
        data:
          color_temp_kelvin: 2700

    - slot: 5
      slot_mode: hard
      entity: light.hue_kontor
      icon: mdi:minus
      name: 5%
      show_name: true
      autoclose: false
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        target:
          entity_id: light.hue_kontor
        data:
          brightness_step_pct: -5

    - slot: 6
      slot_mode: hard
      entity: light.hue_kontor
      icon: mdi:plus
      name: 5%
      show_name: true
      autoclose: false
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        target:
          entity_id: light.hue_kontor
        data:
          brightness_step_pct: 5
