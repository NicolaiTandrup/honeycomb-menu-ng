type: custom:honeycomb-persistent-control
entity: light.hue_kontor
icon: mdi:lightbulb
size: 82
active: true

tap_action:
  action: toggle

presets:
  brightness:
    entity: number.ia_stue_20_2_kokken_kokkeno_stue_normal_brightness
  kelvin:
    entity: number.ia_stue_20_2_kokken_kokkeno_stue_standard_kelvin

menu:
  empty_slots: hidden
  drag_select: true
  drag_deadzone: 12
  hover_highlight: true
  idle_timeout: 8000

  buttons:
    - slot: 1
      slot_mode: hard
      icon: mdi:brightness-7
      name: 100%
      show_name: true
      autoclose: false
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        data:
          brightness_pct: 100

    - slot: 2
      slot_mode: hard
      control: preset-brightness

    - slot: 3
      slot_mode: hard
      icon: mdi:palette
      name: Color
      show_name: true
      autoclose: false
      tap_action:
        action: fire-dom-event
        honeycomb_menu:
          nested_expand: true
          inherit_inner: true
          empty_slots: hidden
          idle_timeout: 8000
          buttons:
            - slot: 7
              slot_mode: hard
              show_icon: false
              show_name: false
              autoclose: false
              styles:
                card:
                  - background: rgb(255,45,45)
              tap_action:
                action: perform-action
                perform_action: light.turn_on
                data:
                  rgb_color: [255, 45, 45]

            - slot: 8
              slot_mode: hard
              show_icon: false
              show_name: false
              autoclose: false
              styles:
                card:
                  - background: rgb(255,105,30)
              tap_action:
                action: perform-action
                perform_action: light.turn_on
                data:
                  rgb_color: [255, 105, 30]

            - slot: 9
              slot_mode: hard
              show_icon: false
              show_name: false
              autoclose: false
              styles:
                card:
                  - background: rgb(255,190,35)
              tap_action:
                action: perform-action
                perform_action: light.turn_on
                data:
                  rgb_color: [255, 190, 35]

            - slot: 10
              slot_mode: hard
              show_icon: false
              show_name: false
              autoclose: false
              styles:
                card:
                  - background: rgb(220,255,45)
              tap_action:
                action: perform-action
                perform_action: light.turn_on
                data:
                  rgb_color: [220, 255, 45]

            - slot: 11
              slot_mode: hard
              show_icon: false
              show_name: false
              autoclose: false
              styles:
                card:
                  - background: rgb(90,235,70)
              tap_action:
                action: perform-action
                perform_action: light.turn_on
                data:
                  rgb_color: [90, 235, 70]

            - slot: 12
              slot_mode: hard
              show_icon: false
