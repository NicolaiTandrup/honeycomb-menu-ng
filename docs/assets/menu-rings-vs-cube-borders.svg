<title id="title">Honeycomb NG menu geometry and cube anatomy</title>
<desc id="description">Left panel: center cube at slot 0, six neighboring cubes in inner menu ring slots 1 through 6, twelve outer menu ring cubes in slots 7 through 18. Right panel: example of a real Honeycomb NG dark cube with a dark cube fill, green inner border and charcoal-gray outer border. Menu rings are spatial groups, not cube background colors.</desc>
