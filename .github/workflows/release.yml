name: Publish manually authorized beta

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact tested branch-head SHA (40 lowercase hex characters)
        required: true
        type: string
      expected_tag:
        description: New SemVer beta tag matching package.json, e.g. v1.8.0-beta.1
        required: true
        type: string
      release_notes:
        description: Authorized beta notes, tests, limitations and merge status
        required: true
        type: string
      publish:
        description: Explicitly authorize publication; false only verifies/prepares
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: beta-publication-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.gates.outputs.commit }}
      tag: ${{ steps.gates.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EXPECTED_TAG: ${{ inputs.expected_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify manual branch head, beta metadata, immutable tag and green matching CI
        id: gates
        env:
          PUBLICATION_MODE: prepare
          RELEASE_OUTPUT: ${{ runner.temp }}/beta-assets
        run: node scripts/beta-release.js
      - uses: actions/download-artifact@v4
        with:
          name: honeycomb-menu-ng
          path: ${{ runner.temp }}/validated-beta
          run-id: ${{ steps.gates.outputs.ci_run }}
          github-token: ${{ github.token }}
      - name: Reproduce tested, committed and staged HACS bundle and checksums
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          RELEASE_OUTPUT: ${{ runner.temp }}/beta-assets
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
          git diff --exit-code -- honeycomb-menu-ng.js
          node scripts/check-beta.js > "$RUNNER_TEMP/reproduced-SHA256SUMS.txt"
          cmp honeycomb-menu-ng.js "$RUNNER_TEMP/validated-beta/honeycomb-menu-ng.js"
          cmp honeycomb-menu-ng.js "$RELEASE_OUTPUT/honeycomb-menu-ng.js"
          cmp "$RUNNER_TEMP/reproduced-SHA256SUMS.txt" "$RUNNER_TEMP/validated-beta/SHA256SUMS.txt"
          cmp "$RUNNER_TEMP/reproduced-SHA256SUMS.txt" "$RELEASE_OUTPUT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-beta-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/beta-assets
          if-no-files-found: error

  publish:
    needs: verify
    if: inputs.publish && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_COMMIT: ${{ needs.verify.outputs.commit }}
      EXPECTED_TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: verified-beta-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/beta-assets
      - name: Recheck source and CI, create immutable tag, verify draft assets, publish prerelease
        id: publish
        env:
          PUBLICATION_MODE: publish
          RELEASE_OUTPUT: ${{ runner.temp }}/beta-assets
          BETA_PUBLICATION_AUTHORIZED: ${{ inputs.publish }}
          APPROVED_NOTES: ${{ inputs.release_notes }}
        run: node scripts/beta-release.js
      - name: Preserve beta publication evidence including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-publication-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/beta-assets
          if-no-files-found: error
