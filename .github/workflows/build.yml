name: Build Honeycomb Menu NG

on:
  push:
    branches:
      - '**'

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify stable promotion keeps retention explicitly disabled
        env:
          RELEASE_RETENTION_ENABLED: ${{ vars.RELEASE_RETENTION_ENABLED }}
        run: |
          node - <<'NODE'
          const version=require('./package.json').version;
          if (/^\d+\.\d+\.\d+$/.test(version) && process.env.RELEASE_RETENTION_ENABLED !== 'false')
            throw new Error('Stable promotion requires RELEASE_RETENTION_ENABLED explicitly false');
          NODE

      - name: Test core contracts
        run: npm test

      - name: Build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build-artifact"
          node scripts/check-release.js | tee "$RUNNER_TEMP/build-artifact/SHA256SUMS.txt"
          cp honeycomb-menu-ng.js "$RUNNER_TEMP/build-artifact/honeycomb-menu-ng.js"
          echo "::notice title=Bundle checksum::$(node scripts/check-release.js)"

      - name: Validate local HACS package and licensing
        run: node scripts/check-hacs-package.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: honeycomb-menu-ng
          path: ${{ runner.temp }}/build-artifact

      - name: Set up browser validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned browser dependencies
        run: |
          python -m pip install -r test/browser/requirements.txt
          python -m playwright install --with-deps chromium
          curl --fail --location --retry 2 https://github.com/custom-cards/button-card/releases/download/v7.0.1/button-card.js --output "$RUNNER_TEMP/button-card.js"

      - name: Validate native Sonos Sleep Timer device-boundary contracts
        run: python test/sleep_timer/run.py

      - name: Measure core visibility and allocation
        run: node test/performance/hub-benchmark.js --output "$RUNNER_TEMP/cube-evidence/core-performance.json"

      - name: Verify shared cubes and module interactions
        run: python test/browser/run.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence"

      - name: Verify both full Honeycomb bundles in both load orders
        run: |
          curl --fail --location --retry 2 https://raw.githubusercontent.com/Sian-Lee-SA/honeycomb-menu/16a2ac09a98c6837cb092603696e97e3a6102b45/honeycomb-menu.js --output "$RUNNER_TEMP/original-honeycomb.js"
          python test/browser/coexistence.py --bundle honeycomb-menu-ng.js --original "$RUNNER_TEMP/original-honeycomb.js" --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/coexistence"

      - name: Verify shared active/inactive cube presentation
        run: python test/browser/presentation.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/presentation"

      - name: Verify native-only Sonos Favorites isolation and lifecycle
        run: python test/browser/native_favorites.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/native-favorites"

      - name: Verify auto floorplan sizing and true hexagonal pulse
        run: python test/browser/beta5.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/beta5"

      - name: Verify stable auto reference and phase-preserving power speed
        run: python test/browser/beta6.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/beta6"

      - name: Verify resolved wave colors, safe overrides and live color transitions
        run: python test/browser/wave_color.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/wave-color"

      - name: Verify Charger states, safe controls, navigation and complete HA dashboards
        run: python test/browser/charger.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/charger"

      - name: Verify two-row labels, padded artwork and real-card editor ownership
        run: python test/browser/track3.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/track3"

      - name: Verify radio artwork pixel bounds across ratios and hex slopes
        run: python test/browser/radio_artwork.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/radio-artwork"

      - name: Verify capability-aware palettes and anchored child navigation
        run: python test/browser/beta4_navigation.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/beta4-navigation"

      - name: Verify cube-3 mode indication and neutral defaults against immutable beta.4
        run: python test/browser/beta5_ui.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/beta5-ui"

      - name: Verify OFF lamp identity and preserved Light navigation
        run: python test/browser/light_off.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/light-off"

      - name: Verify in-cell bee version, motion safety and detached frame cleanup
        run: python test/browser/dev_build.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/bee-version"

      - name: Measure throttled state updates and anchored palette capacity
        run: python test/browser/beta6_hardening.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/beta6-hardening"

      - name: Verify generic Info Cube containment, caller suspension and fixed lifetime
        run: python test/browser/info_cube.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/info-cube"

      - name: Validate documentation and complete YAML examples
        run: python test/docs/run.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/docs"

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-cube-evidence
          path: ${{ runner.temp }}/cube-evidence
          if-no-files-found: ignore

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lint every workflow using pinned, checksum-verified actionlint
        shell: bash
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck="" -pyflakes=""
