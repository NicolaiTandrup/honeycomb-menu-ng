name: Build Honeycomb Menu NG

on:
  push:
    branches:
      - '**'

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test core contracts
        run: npm test

      - name: Build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build

      - name: Verify build output
        run: |
          mkdir -p "$RUNNER_TEMP/build-artifact"
          node scripts/check-release.js | tee "$RUNNER_TEMP/build-artifact/SHA256SUMS.txt"
          cp honeycomb-menu-ng.js "$RUNNER_TEMP/build-artifact/honeycomb-menu-ng.js"
          echo "::notice title=Bundle checksum::$(node scripts/check-release.js)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: honeycomb-menu-ng
          path: ${{ runner.temp }}/build-artifact

      - name: Set up browser validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned browser dependencies
        run: |
          python -m pip install -r test/browser/requirements.txt
          python -m playwright install --with-deps chromium
          curl --fail --location --retry 2 https://github.com/custom-cards/button-card/releases/download/v7.0.1/button-card.js --output "$RUNNER_TEMP/button-card.js"

      - name: Validate native Sonos Sleep Timer device-boundary contracts
        run: python test/sleep_timer/run.py

      - name: Measure core visibility and allocation
        run: node test/performance/hub-benchmark.js --output "$RUNNER_TEMP/cube-evidence/core-performance.json"

      - name: Verify shared cubes and module interactions
        run: python test/browser/run.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence"

      - name: Verify both full Honeycomb bundles in both load orders
        run: |
          curl --fail --location --retry 2 https://raw.githubusercontent.com/Sian-Lee-SA/honeycomb-menu/16a2ac09a98c6837cb092603696e97e3a6102b45/honeycomb-menu.js --output "$RUNNER_TEMP/original-honeycomb.js"
          python test/browser/coexistence.py --bundle honeycomb-menu-ng.js --original "$RUNNER_TEMP/original-honeycomb.js" --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/coexistence"

      - name: Verify shared active/inactive cube presentation
        run: python test/browser/presentation.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/presentation"

      - name: Verify native-only Sonos Favorites isolation and lifecycle
        run: python test/browser/native_favorites.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/native-favorites"

      - name: Validate documentation and complete YAML examples
        run: python test/docs/run.py --bundle honeycomb-menu-ng.js --button-card "$RUNNER_TEMP/button-card.js" --evidence-dir "$RUNNER_TEMP/cube-evidence/docs"

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-cube-evidence
          path: ${{ runner.temp }}/cube-evidence
          if-no-files-found: ignore

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lint every workflow using pinned, checksum-verified actionlint
        shell: bash
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck="" -pyflakes=""
