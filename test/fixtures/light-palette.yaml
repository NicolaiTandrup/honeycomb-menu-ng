# Anonymous reproduction for #74. Keep the same configuration across beta tags.
type: custom:honeycomb-persistent-control
entity: light.room
size: 64
menu:
  animate: false
  animation_speed: 0
  empty_slots: hidden
  idle_timeout: 0
  buttons:
    - slot: 1
      slot_mode: hard
      icon: mdi:brightness-7
      name: 100%
      show_name: true
      autoclose: false
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        data: {brightness_pct: 100}
    - {slot: 2, slot_mode: hard, control: preset-brightness}
    - {slot: 3, slot_mode: hard, control: light-palette}
    - {slot: 4, slot_mode: hard, control: preset-standard}
    - slot: 5
      slot_mode: hard
      icon: mdi:minus
      name: 5%
      show_name: true
      autoclose: false
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        data: {brightness_step_pct: -5}
    - slot: 6
      slot_mode: hard
      icon: mdi:plus
      name: 5%
      show_name: true
      autoclose: false
      tap_action:
        action: perform-action
        perform_action: light.turn_on
        data: {brightness_step_pct: 5}
