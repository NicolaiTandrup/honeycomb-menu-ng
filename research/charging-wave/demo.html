<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Honeycomb NG charging wave study</title>
<link rel="stylesheet" href="primitive.css"><style>
body{background:#18212b;color:#f6f7f9;font:16px Arial;margin:24px}h1{font-size:20px}.samples{display:grid;grid-template-columns:repeat(auto-fill,90px);gap:12px}.sample{position:relative;width:82px;height:94.69px;isolation:isolate}.sample svg{position:absolute;width:100%;height:100%}.fill-layer{position:absolute;inset:6px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}.label{position:absolute;inset:0;display:grid;align-content:center;text-align:center;font-size:12px;font-weight:600;pointer-events:none}.label small{font-size:9px;font-weight:normal}
</style><h1>Shared radial energy-wave study</h1><p>Research only · synthetic Charger 1 · no HA connection or actions</p><div class="samples"></div><script src="primitive.js"></script><script>
const points='50,0 100,28.8675 100,86.6025 50,115.47 0,86.6025 0,28.8675';window.controllers=[];const start=performance.now();
